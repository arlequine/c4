[project]
name = "qa-crew"
version = "0.1.0"
description = "QA crew con CrewAI: spec → tests → código → E2E en verde (Clase 8, bonus) — AI for Developers 30X"
requires-python = ">=3.11,<3.14"
dependencies = ["crewai[anthropic]==1.15.35"]

[project.scripts]
crew = "qa_crew.main:cli"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_crew"]
